apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fiap-billing-database-credentials
  namespace: fiap-billing
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: fiap-billing-database-credentials
    creationPolicy: Owner
  # Importar apenas a connection string deste banco, nunca o segredo do legado.
  data:
    - secretKey: ConnectionStrings__DefaultConnection
      remoteRef:
        key: fiap-billing-database-credentials
        property: ConnectionStrings__DefaultConnection
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fiap-billing-jwt-signing-key
  namespace: fiap-billing
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: fiap-billing-jwt-signing-key
    creationPolicy: Owner
  data:
    - secretKey: Jwt__SigningKey
      remoteRef:
        key: fiap-secret-manager-jwt-signing-key
        property: Jwt__SigningKey
